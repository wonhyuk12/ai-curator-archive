<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 큐레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="hwrap">
    <a class="logo" href="#"><i>AI</i><span>AI 큐레이터</span></a>
    <form class="search" id="searchForm" role="search">
      <span>AI 검색</span>
      <input id="q" type="search" placeholder="모델이나 기능을 검색해 보세요 (예: GPT, 코드 리뷰)" aria-label="모델이나 기능 검색" autocomplete="off"
        role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list">
      <div class="suggest" id="suggest" role="listbox" aria-label="검색 추천" hidden></div>
    </form>
    <a class="to-archive" href="https://ai-archive-weld.vercel.app/"><span class="full">직업별 AI 찾기</span><span class="short">AI 찾기</span> <b aria-hidden="true">→</b></a>
    <button class="bell" type="button" id="bell" aria-label="알림" aria-haspopup="dialog" aria-expanded="false" aria-controls="noti"><svg viewBox="0 0 24 24"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1Z"/></svg><b id="bellCount"></b></button>
    <div class="noti" id="noti" role="dialog" aria-label="알림" hidden></div>
  </div>
</header>
<p class="note">프로토타입 화면 · 점수, 등락률, 소식은 디자인 확인용 예시 데이터예요</p>

<main>
  <!-- 오늘의 AI 시장 -->
  <section class="a-idx idx" id="idx" aria-label="오늘의 AI 시장"></section>

  <!-- LLM 차트 -->
  <section class="a-chart card" aria-labelledby="chartTitle">
    <div class="head"><h2 id="chartTitle">LLM 차트</h2><small id="chartTime">오늘 18:00 기준</small></div>
    <div class="tabs" id="rankTabs" role="group" aria-label="정렬">
      <button type="button" data-k="new" aria-pressed="true">최신</button>
      <button type="button" data-k="hot" aria-pressed="false">화제성</button>
      <button type="button" data-k="price">요금</button>
      <button type="button" data-k="up">급상승</button>
      <button type="button" data-k="fav">관심</button>
    </div>
    <div class="pmode" id="pmode" role="group" aria-label="요금 종류" hidden>
      <button type="button" data-pm="api" aria-pressed="true">API</button>
      <button type="button" data-pm="free" aria-pressed="false">무료</button>
      <button type="button" data-pm="pro" aria-pressed="false">Pro</button>
      <button type="button" data-pm="max" aria-pressed="false">Max</button>
    </div>
    <div class="rows" id="rows"></div>
    <p class="legend">화제성 점수 = 공식 발표 수·개발자 커뮤니티 언급량을 합친 지수 (예시)</p>
  </section>

  <!-- 소식 -->
  <section class="a-feed card" aria-labelledby="feedTitle">
    <div class="head"><h2 id="feedTitle">주요 소식</h2><small id="feedCount"></small></div>
    <label class="feed-search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.92 12.1l4.24 4.24-1.42 1.42-4.24-4.24A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
      <input id="feedQ" type="search" placeholder="소식 검색 (예: 요금, GPT, 종료)" aria-label="주요 소식 검색" autocomplete="off">
    </label>
    <div class="feed" id="feed"></div>
  </section>
</main>

<!-- 모델 상세 / 검색 결과 시트 -->
<div class="dim" id="dim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<!-- 데이터 먼저, 화면 코드는 그다음 -->
<!-- 키오스크(/news/ 경로로 서비스될 때)에서만 설문·이용 기록 위젯을 불러와요 -->
<script>
  if (location.pathname.startsWith("/news/")) {
    const s = document.createElement("script"); s.src = "/kiosk/kiosk.js"; document.head.appendChild(s);
  }
</script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
