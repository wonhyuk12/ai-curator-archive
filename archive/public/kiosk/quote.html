<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 도구 견적</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#121417; --surface:#1b1e23; --card:#22262c; --line:#373c44; --line2:#545a63;
  --fg:#d9dde3; --sub:#acb3bc; --mut:#959da8;
  --pri:#bfc4cb; --pri-bg:#30343a; --info:#89b4fa; --ok:#a6e3a1; --check:#f9e2af; --con:#fab387; --teal:#94e2d5; --hl:#1b2b2b;
  --r-s:8px; --r-m:12px; --r-l:16px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 'IBM Plex Sans KR',system-ui,sans-serif}
a{color:var(--pri)} button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
input,textarea{font:inherit;color:var(--fg)}
input::placeholder,textarea::placeholder{color:#858c96}
.mono{font-family:'JetBrains Mono',monospace}
.t12{font-size:12px}.t14{font-size:14px}.t16{font-size:16px}.t20{font-size:20px}
.sub{color:var(--sub)}.mut{color:var(--mut)}
h1{margin:0;font-size:28px;line-height:1.3;font-weight:700;letter-spacing:-.02em}
h2{margin:0;font-size:20px;font-weight:700}
h3{margin:0;font-size:16px;font-weight:700}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

header.top{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;background:none;border:0;padding:0}
.logo i{width:30px;height:30px;border-radius:var(--r-s);background:var(--pri);display:grid;place-items:center}
.nav{margin-left:auto;display:flex;align-items:center;gap:4px}
.nav button{min-height:44px;padding:0 14px;border-radius:var(--r-s);border:0;background:transparent;color:var(--sub);font-size:14px}
.nav button[aria-current="page"]{background:var(--fg);color:var(--bg);font-weight:600}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--check);color:var(--bg);font-size:12px;font-weight:700}
.pts{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);font-size:14px;color:var(--fg)}
.pts b{font-family:'JetBrains Mono',monospace}

.wrap{margin:0 auto;padding:28px 24px 120px;display:flex;flex-direction:column;gap:20px}
.narrow{max-width:960px}.wide{max-width:1200px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.steps button{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 12px 0 6px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:14px}
.steps button i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;background:var(--line2);color:var(--fg)}
.steps button.done i{background:var(--teal);color:var(--bg)}
.steps button[aria-current="step"]{border-color:var(--pri);color:var(--fg);font-weight:600}
.steps button[aria-current="step"] i{background:var(--pri);color:var(--bg)}
.steps button:disabled{cursor:default;opacity:.7}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 16px}
.tip{background:#172524;border:1px solid #2f514c;border-radius:var(--r-m);padding:12px 14px;font-size:14px;line-height:1.6}
.warn{background:#24231f;border:1px solid #5e5a4a;border-radius:var(--r-m);padding:12px 14px;font-size:14px;line-height:1.6}

.btn{min-height:48px;padding:0 24px;border-radius:999px;border:1px solid var(--line2);background:transparent;font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--fg)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--bg);font-weight:700}
.btn.sm{min-height:44px;font-size:14px;padding:0 18px}
.sbtn{min-height:44px;padding:0 14px;border-radius:var(--r-s);border:1px solid var(--line2);background:transparent;font-size:14px;color:var(--sub)}
.sbtn[aria-pressed="true"],.sbtn[aria-checked="true"]{background:var(--pri-bg);border-color:var(--pri);color:var(--fg);font-weight:600}
.link{border:0;background:none;padding:0;min-height:44px;color:var(--pri);font-size:14px;font-weight:600}
.q{width:36px;height:36px;border:0;background:none;display:inline-grid;place-items:center;flex-shrink:0}
.q span{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--mut);color:var(--sub);font-size:12px;font-weight:700;display:grid;place-items:center}

.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:700;color:var(--bg);white-space:nowrap}
.tag.ok{background:var(--ok)}.tag.chk{background:var(--check)}.tag.con{background:var(--con)}.tag.teal{background:var(--teal)}
.tag.line{background:transparent;border:1px solid var(--line2);color:var(--sub);font-weight:600}
.tag.none{background:var(--line2);color:var(--fg)}

/* home */
.home{min-height:calc(100vh - 69px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 24px 64px;text-align:center}
.home h1{font-size:44px;letter-spacing:-.03em}
.ta{position:relative;width:100%;max-width:760px}
.ta textarea{display:block;width:100%;min-height:148px;padding:20px 76px 20px 22px;border-radius:var(--r-l);border:1px solid var(--line2);background:var(--card);font-size:16px;line-height:1.65;resize:vertical;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.send{position:absolute;right:14px;bottom:14px;width:48px;height:48px;border-radius:50%;border:0;background:var(--pri);display:grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.chip{min-height:36px;padding:0 12px;border-radius:999px;border:1px dashed #686e78;background:transparent;font-size:14px;color:var(--fg)}
.chip.on{border:1px solid var(--teal);background:var(--teal);color:var(--bg);font-weight:600}
.chip em{font-style:normal;color:var(--mut);margin-left:4px}
.guide{width:100%;max-width:760px;text-align:left;display:flex;flex-direction:column;gap:12px;padding:18px 20px}
.guide ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.guide li{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:var(--r-m);background:var(--surface);font-size:14px}
.guide li b{color:var(--teal);font-size:12px}

/* analyzing */
.ana{min-height:calc(100vh - 69px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.ana ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:320px}
.ana li{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--mut)}
.ana li.done{color:var(--fg)}
.ana li i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}
.ana li.done i{background:var(--teal);border-color:var(--teal);color:var(--bg)}

/* confirm */
.envchips{display:flex;flex-wrap:wrap;gap:8px}
.ec{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-size:14px;color:var(--fg)}
.ec small{color:var(--mut);font-size:12px}
.ec.add{border-style:dashed;background:transparent;color:var(--sub)}
.ec.hl{border-color:var(--teal);background:var(--hl)}
.ec[aria-expanded="true"]{border-color:var(--pri)}
.editor{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:12px 14px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 140px 120px;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow.hl{background:var(--hl)}
.srow .nm{display:flex;flex-direction:column;min-width:0}
.srow .st{justify-self:start}
.srow .act{justify-self:end}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.preset{text-align:left;display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--surface)}
.preset[aria-checked="true"]{border-color:var(--pri);background:var(--pri-bg)}
.num{width:64px;height:44px;padding:0 10px;border-radius:var(--r-s);border:1px solid var(--line2);background:var(--bg);font:600 14px 'JetBrains Mono',monospace;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 label{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-m);background:var(--surface)}
.big{font:700 20px 'JetBrains Mono',monospace;color:var(--pri)}
.talk{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(912px,calc(100% - 32px));z-index:10;display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:var(--r-l);background:var(--card);border:1.5px solid var(--info);box-shadow:0 16px 48px rgba(0,0,0,.6)}
.talk form{display:flex;gap:8px}
.talk input{flex:1;min-width:0;height:48px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:var(--bg);font-size:16px}
.talk .go{width:48px;height:48px;border-radius:50%;border:0;background:var(--info);display:grid;place-items:center;flex-shrink:0}
.talk.mini .reply,.talk.mini .hintrow,.talk.mini .hist,.talk.mini #talkPreview{display:none!important}
.talk.mini{padding:8px 10px}
.reply{display:flex;flex-direction:column;gap:6px;font-size:14px}
.change{display:inline-block;padding:3px 8px;border-radius:6px;background:var(--bg);color:var(--teal);font-size:14px}
.hist{max-height:180px;overflow:auto;display:flex;flex-direction:column;gap:6px;font-size:14px}
.hist .me{align-self:flex-end;background:var(--info);color:var(--bg);padding:6px 12px;border-radius:var(--r-m)}
.hist .ai{align-self:flex-start;background:var(--surface);padding:6px 12px;border-radius:var(--r-m)}

/* quote */
.cond{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14px;color:var(--sub)}
.cond span{padding:4px 10px;border-radius:6px;background:var(--card);border:1px solid var(--line)}
.qgrid{display:grid;grid-template-columns:170px repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.qgrid>div{padding:16px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);background:var(--card)}
.qgrid>.lab{border-left:0;background:var(--surface);font-size:14px;font-weight:600;color:var(--sub);display:flex;flex-direction:column;gap:2px}
.qgrid>.sel{background:var(--pri-bg);box-shadow:inset 2px 0 0 var(--pri),inset -2px 0 0 var(--pri)}
.qgrid>.sel.first{box-shadow:inset 2px 0 0 var(--pri),inset -2px 0 0 var(--pri),inset 0 2px 0 var(--pri)}
.qgrid>.last{border-bottom:0}
.qgrid>.altrow{grid-column:1/-1;border-left:0;background:var(--surface)}
.price{font:700 28px 'JetBrains Mono',monospace;line-height:1.2}
.cell{display:flex;flex-direction:column;gap:6px}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.alt{text-align:left;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:14px}
.alt .mono{white-space:nowrap}
.alt[aria-checked="true"]{border-color:var(--pri);background:var(--pri-bg)}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-radius:var(--r-l);background:var(--card);border:1px solid var(--line2)}

/* try */
.tcard{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.tcard textarea{width:100%;min-height:72px;padding:12px 14px;border-radius:var(--r-m);border:1px solid var(--line2);background:var(--bg);font:500 14px/1.6 'JetBrains Mono',monospace;resize:vertical}
.result{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.frame{aspect-ratio:1;border-radius:var(--r-m);border:1px solid var(--line2);background:repeating-conic-gradient(#30343a 0% 25%,#282c32 0% 50%) 50%/16px 16px;display:grid;place-items:center;color:var(--mut)}
.wave{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line)}
.wave i{display:flex;align-items:center;gap:2px;height:32px;flex:1}
.wave i span{flex:1;background:var(--info);border-radius:2px;opacity:.8}
pre.code{margin:0;padding:14px 16px;border-radius:var(--r-m);background:var(--bg);border:1px solid var(--line);font:500 13px/1.6 'JetBrains Mono',monospace;overflow:auto;color:var(--fg)}
.examples{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ex{border-radius:var(--r-m);border:1px solid var(--line);overflow:hidden;background:var(--surface)}
.ex .pic{height:140px;display:grid;place-items:center;color:var(--mut);font-size:14px}
.ex .pic.real{background:#fff}
.ex .pic img{max-width:100%;max-height:140px;object-fit:contain}
.ex div.b{padding:10px 12px;font-size:14px}

/* adopt & track */
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.two>*{min-width:0}
.cbox{display:flex;align-items:center;gap:10px;min-height:40px;font-size:14px;cursor:pointer}
.cbox input{width:18px;height:18px;accent-color:var(--pri)}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--pri)}
.gsteps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:g}
.gsteps li{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px;line-height:1.6;counter-increment:g}
.gsteps li::before{content:counter(g);width:24px;height:24px;border-radius:50%;background:var(--line2);display:grid;place-items:center;font-size:12px;font-weight:700}
.cmd{display:flex;align-items:center;gap:8px;margin-top:6px;padding:6px 6px 6px 12px;border-radius:var(--r-s);background:var(--bg);border:1px solid var(--line);font:500 13px 'JetBrains Mono',monospace}
.cmd span{flex:1;overflow:auto;white-space:nowrap}
.cmd button{min-height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--line2);background:transparent;font-size:12px;color:var(--sub)}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{text-align:left;display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--card)}
.pitem[aria-current="true"]{border-color:var(--pri);background:var(--pri-bg)}
.toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:20;padding:10px 18px;border-radius:999px;background:var(--teal);color:var(--bg);font-weight:700;font-size:14px}

@media (max-width:860px){
  .presets,.grid2,.two,.examples,.guide ol{grid-template-columns:1fr}
  .home h1{font-size:28px}
  .qgrid{grid-template-columns:110px repeat(3,minmax(200px,1fr));overflow-x:auto}
  .srow{grid-template-columns:1fr auto}
}


/* --- Engine design background overlay --- */
html, body {
  min-height: 100%;
}
body {
  position: relative;
  overflow-x: hidden;
}
#engine-design-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 18% 22%, rgba(137,180,250,.06), transparent 24%),
    radial-gradient(circle at 78% 38%, rgba(148,226,213,.05), transparent 28%),
    linear-gradient(180deg, rgba(17,17,27,.06), rgba(17,17,27,.16));
}
#engine-design-bg::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(137,180,250,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(137,180,250,.045) 1px, transparent 1px),
    linear-gradient(rgba(137,180,250,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(137,180,250,.025) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  background-position: 0 0, 0 0, 0 0, 0 0;
  opacity: .7;
}
#engine-design-bg svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
/* Blur only decorative background lettering, not foreground UI text. */
#engine-design-bg svg text {
  filter: blur(3px);
}

#engine-design-bg .dash-path {
  stroke-dasharray: 10 12;
  animation: routeFlow 16s linear infinite;
}
#engine-design-bg .blink {
  animation: softBlink 3.6s ease-in-out infinite;
}
#engine-design-bg .scan {
  animation: scanPulse 6s ease-in-out infinite;
  transform-origin: center;
}
#engine-design-bg .build-dot {
  animation: moveMarker 11s linear infinite;
}
#app {
  position: relative;
  z-index: 1;
}
@keyframes routeFlow {
  from { stroke-dashoffset: 0; }
  to { stroke-dashoffset: -220; }
}
@keyframes softBlink {
  0%, 100% { opacity: .45; }
  50% { opacity: 1; }
}
@keyframes scanPulse {
  0%, 100% { opacity: .32; transform: scale(1); }
  50% { opacity: .8; transform: scale(1.012); }
}
@keyframes moveMarker {
  0% { offset-distance: 0%; opacity: 0; }
  8% { opacity: 1; }
  90% { opacity: 1; }
  100% { offset-distance: 100%; opacity: 0; }
}


/* Transparent, sticky, single-column environment sidebar */
.confirm-page { max-width:1280px; }
.confirm-layout {
  display:grid;
  grid-template-columns:minmax(235px,275px) minmax(0,1fr);
  grid-template-areas:"sidebar content";
  gap:24px;
  align-items:start;
}
.confirm-content {
  grid-area:content;
  display:flex;
  flex-direction:column;
  gap:20px;
  min-width:0;
}
.confirm-sidebar {
  grid-area:sidebar;
  position:sticky;
  top:92px;
  align-self:start;
  max-height:calc(100vh - 112px);
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:18px 14px;
  border:1px solid rgba(166,173,200,.23);
  border-radius:16px;
  background:transparent;
  box-shadow:none;
  display:flex;
  flex-direction:column;
  gap:12px;
  scrollbar-width:thin;
}
.confirm-sidebar h2 { font-size:18px; }
.confirm-sidebar .envchips { display:flex; flex-direction:column; flex-wrap:nowrap; gap:9px; }
.confirm-sidebar .ec {
  display:flex;
  width:100%;
  min-height:48px;
  flex-wrap:wrap;
  justify-content:flex-start;
  text-align:left;
  gap:3px 9px;
  padding:9px 10px;
  border-radius:11px;
  background:rgba(30,30,46,.18);
  border:1px solid rgba(166,173,200,.25);
  white-space:normal;
}
.confirm-sidebar .ec:hover { background:rgba(137,180,250,.08); }
.confirm-sidebar .ec b { font-size:13px; line-height:1.5; overflow-wrap:anywhere; }
.confirm-sidebar .ec small { white-space:nowrap; }
.confirm-sidebar .ec .tag { margin-left:auto; }
.confirm-sidebar .editor { background:rgba(24,24,37,.32); }
@media(max-width:760px) {
  .confirm-layout { grid-template-columns:minmax(0,1fr); grid-template-areas:"sidebar" "content"; gap:18px; }
  .confirm-sidebar { position:relative; top:auto; max-height:none; }
  .confirm-sidebar .envchips { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); }
}

</style>
</head>
<body>

<div id="engine-design-bg" aria-hidden="true">
  <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="presentation" aria-hidden="true">
    <defs>
      <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="6" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <style>
        .ed-label { font: 600 15px 'JetBrains Mono', monospace; fill: rgba(205,214,244,.58); letter-spacing: .04em; }
        .ed-small { font: 500 12px 'JetBrains Mono', monospace; fill: rgba(166,173,200,.52); letter-spacing: .06em; }
        .ed-line { stroke: rgba(137,180,250,.28); stroke-width: 2; fill: none; }
        .ed-line2 { stroke: rgba(148,226,213,.24); stroke-width: 2; fill: none; }

  if (genre || style) env.style = [/2d/.test(t) ? '2D' : '', genre || '', style, sz ? sz[1] + '×' + sz[2] : ''].filter(Boolean).join(' · ');
  if (/20\s*x|max\s*20/.test(t)) env.plan = 'max20'; else if (/max|맥스/.test(t)) { env.plan = 'max5'; guess.plan = true; } else if (/\bpro\b|프로/.test(t)) env.plan = 'pro';

    const self = /(그림|아트)[은는을]?\s*(제가\s*)?(직접|손으로)|직접\s*그려/.test(t);

function parseTalk(t) {
  const ch = [], hl = {}, next = { env: Object.assign({}, S.env), envGuess: Object.assign({}, S.envGuess), steps: JSON.parse(JSON.stringify(S.steps)), focus: [...S.focus] };
  let first = '';
  const mark = (k, txt) => { ch.push(txt); hl[k] = 1; if (!first) first = k; };
  const e = next.env;
  if (/20\s*x|20배/i.test(t) && e.plan !== 'max20') { e.plan = 'max20'; delete next.envGuess.plan; mark('plan', 'AI 구독 → Claude Max 20x'); }
  else if (/\bpro\b|프로/i.test(t) && e.plan !== 'pro') { e.plan = 'pro'; delete next.envGuess.plan; mark('plan', 'AI 구독 → Claude Pro'); }
  else if (/5\s*x|5배/i.test(t) && (e.plan !== 'max5' || next.envGuess.plan)) { e.plan = 'max5'; delete next.envGuess.plan; mark('plan', 'AI 구독 → Claude Max 5x (확인됨)'); }
  if (/godot|고도/i.test(t) && e.engine !== 'Godot') { e.engine = 'Godot'; mark('engine', '엔진 → Godot'); }
  else if (/유니티|unity/i.test(t) && e.engine !== 'Unity') { e.engine = 'Unity'; mark('engine', '엔진 → Unity'); }
  const bm = t.match(/(\d+)\s*만\s*원?/);
  if (bm && /(예산|쓸|돈|원)/.test(t) && +bm[1] * 10000 !== e.budget) { e.budget = +bm[1] * 10000; mark('budget', `예산 → ${won(e.budget)}원`); }
  const WORDS = { code: /(코드|코딩|스크립트)/, art: /(그림|아트|캐릭터|그려|그립)/, anim: /(애니메이션|움직임|동작)/, sfx: /(효과음|소리|사운드|음악)/ };
  const nope = /(필요\s*없|안\s*(해|만들|써)|빼|없어도)/, self = /(직접|제가|손으로)/, want = /(필요해|필요하|넣어|도와|있어야)/;
  t.split(/[,.]|그리고|(?<=[가-힣])고\s|지만\s/).map((x) => x.trim()).filter(Boolean).forEach((cl) => {
    Object.keys(WORDS).forEach((k) => {
      if (!WORDS[k].test(cl)) return;
      const st = next.steps[k];
      if (/(품질|퀄리티|중요|제대로)/.test(cl)) { if (!st) next.steps[k] = { now: '도구 없음' }; else st.self = false; if (!next.focus.includes(k)) { next.focus = [...next.focus.filter((x) => x !== k), k].slice(-2); mark(k, `${STEP_INFO[k].name} → 신경 쓸 단계`); } return; }
      if (nope.test(cl)) { if (st) { delete next.steps[k]; next.focus = next.focus.filter((x) => x !== k); mark(k === 'code' ? 'plan' : 'add', `${STEP_INFO[k].name} → 단계에서 뺌`); } return; }
      if (self.test(cl) && k !== 'code') { if (!st) next.steps[k] = { now: '직접 함', self: true }; else { st.self = true; st.now = '직접 함'; } next.focus = next.focus.filter((x) => x !== k); mark(k, `${STEP_INFO[k].name} → 직접 함, 견적에서 뺌`); return; }
      if (want.test(cl) && (!st || st.self)) { next.steps[k] = { now: '도구 없음' }; mark(k, `${STEP_INFO[k].name} → 견적에 넣음`); }
    });
  });
  let np = null;
  if (/데모|게임잼|공모전|시연/.test(t)) np = 'demo'; else if (/출시|스팀|스토어|유료/.test(t)) np = 'big';
  if (np && np !== S.preset) { next.preset = np; next.q = Object.assign({}, PRESETS[np].v); mark('scale', `게임 규모 → ${PRESETS[np].name.split(' · ')[0]}`); }
  return { next, ch, hl, first };
}

function talk(text) {

        <ol class="gsteps">${g.steps.map(([s, cmd], j) => `<li><span><label class="cbox" style="min-height:auto;align-items:flex-start"><input type="checkbox" data-c="${id + j}" ${S.checks[id + j] ? 'checked' : ''} style="margin-top:3px">${esc(s)}</label>${cmd ? `<span class="cmd"><span>${esc(cmd)}</span><button data-a="copy" data-v="${esc(cmd)}">복사</button></span>` : ''}</span></li>`).join('')}</ol>
        <div class="tip"><b style="color:var(--teal)">잘 됐는지 확인</b> ${g.ok}</div>
        ${ps.length ? `<div style="display:flex;flex-direction:column;gap:6px"><b class="t14">처음 써 볼 프롬프트</b>${ps.map(([h, p, d]) => `<div class="cmd" style="flex-wrap:wrap"><span><b style="font-family:inherit">${h}</b> · ${esc(p)}</span><button data-a="copy" data-v="${esc(p)}">복사</button></div>`).join('')}</div>` : ''}
        ${g.stuck.length ? `<details class="t14"><summary style="cursor:pointer;color:var(--sub);min-height:32px">막혔을 때</summary><ul style="margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px">${g.stuck.map(([q, a]) => `<li><b>${q}</b> — <span class="sub">${a}</span></li>`).join('')}</ul></details>` : ''}` : ''}
    </article>`;
  };
  return `<main class="wrap wide">${stepper('adopt')}
    <section style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px">
      <div style="display:flex;flex-direction:column;gap:6px"><h1>도입 준비</h1><p class="sub" style="max-width:70ch">순서대로 따라 하면 됩니다. 끝낸 단계는 체크해 두세요. 설치는 각 도구의 공식 안내를 따르고, 이 화면은 순서와 확인 방법을 정리합니다.</p></div>
      <div style="text-align:right"><span class="t14 mut">${TIERS[S.sel].name} 견적</span><br><b class="mono t20">추가 ${won(add)}원/월</b><br><span class="t14 sub">한 달 총액 ${won(plan + add)}원</span></div>
    </section>
    <div class="two">
      <div style="display:flex;flex-direction:column;gap:14px">
        ${ids.map(block).join('')}
        ${anyPay ? '<p class="box t14 sub">결제에는 해외 결제가 되는 카드(Visa·Mastercard)가 필요하고, 구독은 매달 자동 결제됩니다. 작업을 쉬는 달에는 해지하세요.</p>' : ''}
      </div>
      <aside style="display:flex;flex-direction:column;gap:14px;position:sticky;top:16px">
        <section class="card" style="padding:18px;display:flex;flex-direction:column;gap:10px"><h3>준비 상황</h3>
          <div style="display:flex;align-items:center;gap:10px"><div class="prog" style="flex:1"><i style="width:${allChecks.length ? Math.round(n / allChecks.length * 100) : 0}%"></i></div><span class="mono t14 sub">${n} / ${allChecks.length}</span></div>
          <p class="t14 sub">${n === allChecks.length && n ? '모든 단계를 마쳤습니다.' : '체크한 단계는 저장하면 다음에도 남아 있습니다.'}</p></section>
        <form class="card" data-f="save" style="display:flex;flex-direction:column;gap:10px;padding:18px"><h3>견적 저장하기</h3>
          <p class="t14 sub">저장하면 내 견적에 프로젝트로 남고, 더 나은 선택이 생기면 알려 드립니다.</p>
          <label for="pname" class="t14" style="font-weight:600">프로젝트 이름</label><input id="pname" value="${esc(defaultName())}" style="height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg)">
          <label for="email" class="t14" style="font-weight:600">이메일</label><input id="email" type="email" placeholder="you@example.com" style="height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg)">
          <button class="btn pri" type="submit">저장하고 내 견적 보기</button>
          <p class="t12 mut">비밀번호는 만들지 않습니다. 다음에는 이메일로 받은 링크로 들어옵니다.</p></form>
      </aside>
    </div>
  </main>`;
}
function defaultName() {
  const g = (S.env.style || '').split(' · ').filter((x) => !/×/.test(x)).join(' ');
  return (g || '새 게임') + (S.env.engine ? ` (${S.env.engine})` : '');
}

/* ---------- 06 내 견적 · 알림 ---------- */
function track() {
  const P = S.projects, cur = P.find((p) => p.id === S.cur) || P[0];
  return `<main class="wrap wide">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px"><h1>내 견적 · 알림</h1><button class="btn sm pri" data-a="newProject">+ 새 프로젝트 견적</button></div>
    <div class="two" style="grid-template-columns:300px 1fr">
      <aside style="display:flex;flex-direction:column;gap:10px"><span class="t14 sub">프로젝트 ${P.length}개</span>
        <div class="plist">${P.map((p) => `<button class="pitem" data-a="pickProject" data-v="${p.id}" aria-current="${p.id === cur.id}"><span style="display:flex;justify-content:space-between;gap:8px"><b class="t14">${esc(p.name)}</b>${p.fresh ? '<span class="tag teal">방금 저장</span>' : p.alerts ? `<span class="badge" style="margin:0">${p.alerts}</span>` : ''}</span><span class="t12 sub">${p.tier} · 추가 ${won(p.add)}원/월 · ${p.date}</span></button>`).join('')}</div>
      </aside>
      <section style="display:flex;flex-direction:column;gap:14px">
        <article class="card" style="padding:18px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px">
          <div style="flex:1 1 300px"><h2>${esc(cur.name)}</h2><span class="t14 sub">${cur.tier} 견적 · ${esc(cur.tools)}</span></div>
          <div style="text-align:right"><b class="mono t20" style="color:var(--pri)">추가 ${won(cur.add)}원/월</b><br><span class="t14 sub">한 달 총액 ${won(cur.total)}원</span></div>
          ${cur.snap ? `<button class="btn sm" data-a="openProject" data-v="${cur.id}">견적 다시 보기</button>` : ''}
        </article>
        <h3>알림</h3>
        ${cur.alerts ? `<article class="card" style="padding:18px 20px;display:flex;flex-direction:column;gap:10px;border:2px solid var(--check)">
          <span style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"><span class="tag chk">더 나은 선택</span><span class="t14 sub">게임 코드</span></span>
          <b class="t16" style="line-height:1.5">지금 구독으로 쓸 수 있는 새 모델이 공개 코드 평가에서 지금 모델보다 높게 나왔습니다</b>
          <p class="t14 sub">추가 비용 없음 · 설정에서 모델만 바꾸면 됩니다 ${qbtn('eval', '근거 보기')}</p>
          ${tipBox('eval', '공개 코드 평가 2곳(같은 코딩 문제를 여러 AI에게 풀게 하고 채점해 순위를 공개하는 곳)에서 모두 더 높게 나왔습니다. 한 곳만 높으면 알리지 않습니다.')}
          <span style="display:flex;gap:8px"><button class="btn sm pri">바뀐 견적 보기</button><button class="btn sm">지금 그대로 쓰기</button></span></article>` : '<p class="box t14 sub">새 알림이 없습니다. 더 나은 선택이 생기면 여기와 이메일로 알려 드립니다.</p>'}
        <details class="card" style="padding:14px 20px"><summary style="cursor:pointer;font-weight:700">보관함 <span class="t14 sub" style="font-weight:400">· 그림·소리 변경 1건</span></summary>
          <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px"><p class="t14 sub">이미 만든 그림과 새 그림의 모습이 섞이지 않도록, 그림·소리 변경은 모아 두었다가 새 프로젝트를 시작할 때 알려 드립니다.</p>
          <div class="box t14">Retro Diffusion이 같은 작업량 기준으로 PixelLab보다 한 달 비용이 적게 측정되었습니다</div></div></details>
        <p class="t12 mut">알림 기준 · 게임 코드는 공개 평가 2곳에서 모두 더 높을 때 바로, 그림·소리는 새 프로젝트를 시작할 때 알립니다. 가격은 매주 확인합니다.</p>
      </section>
    </div>
  </main>`;
}

/* ---------- 그리기와 이벤트 ---------- */
const SCREENS = { home, analyzing, confirm: confirmScreen, quote, try: tryScreen, adopt, track };
let lastScroll = 0;
function render() {
  const app = document.getElementById('app'), y = window.scrollY;
  app.innerHTML = header() + SCREENS[S.screen]() + (S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : '');
  const bar = app.querySelector('.talk'), main = app.querySelector('main');
  if (bar && main) main.style.paddingBottom = (bar.offsetHeight + 48) + 'px';
  window.scrollTo(0, y); lastScroll = window.scrollY;
}
function go(s) { S.screen = s; S.edit = ''; S.cellOpen = ''; render(); window.scrollTo(0, 0); }
function toast(msg) { S.toast = msg; render(); setTimeout(() => { S.toast = ''; render(); }, 1600); }
window.addEventListener('scroll', () => { const bar = document.querySelector('.talk'); if (!bar || bar.classList.contains('mini')) return; if (document.activeElement && document.activeElement.id === 'talkIn') return; if (Math.abs(window.scrollY - lastScroll) > 60) bar.classList.add('mini'); }, { passive: true });
document.addEventListener('focusin', (e) => { if (e.target.id === 'talkIn') { const b = document.querySelector('.talk'); if (b) b.classList.remove('mini'); } });

function startAnalyze() {
  const text = S.text.trim() || SAMPLE; S.text = text;
  const r = analyze(text);
  S.beginner = isBeginner(text) && !(r.env.engine);
  if (/(처음|보고\s*싶|안\s*정했)/.test(text)) S.beginner = true;
  S.env = r.env; S.envGuess = r.guess; S.steps = r.steps;
  S.focus = []; S.log = []; S.hl = {}; S.history = []; S.pick = { 1: {}, 2: {}, 3: {} };
  S.ana = 0; go('analyzing');
  const tick = () => { S.ana++; render(); if (S.ana < 4) setTimeout(tick, 350); else setTimeout(() => go('confirm'), 350); };
  setTimeout(tick, 350);
}
const A = {
  go: (v) => go(v),
  newProject: () => { Object.assign(S, freshState()); S.beginner = false; go('home'); },
  submit: () => { S.text = document.getElementById('task').value; startAnalyze(); },
  chip: (v) => { const ta = document.getElementById('task'); const cur = ta.value; ta.value = cur + (cur && !cur.endsWith('\n') ? '\n' : '') + v + ': '; S.text = ta.value; ta.focus(); document.getElementById('chips').innerHTML = chipsHtml(); },
  guide: () => { S.text = document.getElementById('task').value; S.guide = !S.guide; render(); },
  tip: (v) => { S.open[v] = !S.open[v]; render(); },
  edit: (v) => { S.edit = S.edit === v ? '' : v; render(); },
  setEnv: (v) => { const [k, o] = v.split('|'); if (o === '없음') delete S.env[k]; else S.env[k] = o; delete S.envGuess[k];
    if (k === 'engine' && o === '정하지 않음') { S.beginner = true; }
    if ((k === 'tool' || k === 'plan') && S.steps.code) S.steps.code.now = S.env.tool ? S.env.tool + (S.env.plan ? ' + ' + PLANS[S.env.plan][0] : '') : '도구 없음';
    S.edit = ''; S.hl = {}; render(); },
  saveStyle: () => { const v = document.getElementById('styleIn').value.trim(); if (v) S.env.style = v; else delete S.env.style; S.edit = ''; render(); },
  saveBudget: () => { const n = parseInt(document.getElementById('budgetIn').value.replace(/[^0-9]/g, ''), 10) || 0; if (n) S.env.budget = n; else delete S.env.budget; S.edit = ''; render(); },
  budgetType: (v) => { S.envBudgetTotal = v === 'total'; render(); },
  addStep: (v) => { S.steps[v] = { now: v === 'code' && S.env.tool ? S.env.tool : '도구 없음' }; S.hl = { [v]: 1 }; render(); },
  removeStep: (v) => { delete S.steps[v]; S.focus = S.focus.filter((x) => x !== v); S.hl = {}; render(); },
  selfToggle: (v) => { S.steps[v].self = !S.steps[v].self; S.steps[v].now = S.steps[v].self ? '직접 함' : '도구 없음'; render(); },
  focus: (v) => { S.focus = S.focus.includes(v) ? S.focus.filter((x) => x !== v) : [...S.focus, v].slice(-2); render(); },
  preset: (v) => { S.preset = v; S.q = Object.assign({}, PRESETS[v].v); S.hl = {}; render(); },
  detail: () => { S.detail = !S.detail; render(); },
  limit: (v) => { S.limit = v; render(); },
  hint: (v) => talk(v),
  undo: () => { const s = S.history.pop(); if (!s) return; Object.assign(S, s); S.hl = {}; S.log.forEach((m) => { m.undoable = false; }); S.log.push({ who: 'ai', text: '방금 고친 내용을 되돌렸어요.', changes: [] }); render(); },
  jump: (v) => { const el = document.getElementById('row-' + v); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); },
  hist: () => { S.histOpen = !S.histOpen; render(); },
  selTier: (v) => { S.sel = +v; render(); },
  cell: (v) => { S.cellOpen = S.cellOpen === v ? '' : v; render(); },
  pick: (v) => { const [i, rk, id] = v.split('|'); S.pick[i] = Object.assign({}, S.pick[i], { [rk]: id }); S.sel = +i; S.cellOpen = ''; render(); },
  pc: () => { S.pcOk = true; render(); },
  pickPrompt: (v) => { const [id, j] = v.split('|'); S.tries[id] = Object.assign({}, S.tries[id], { p: +j, done: false }); render(); },
  run: (v) => { const cost = T[v].cost || 5; if (S.points < cost) { S.charge = true; toast('포인트가 부족합니다'); return; } S.points -= cost; S.tries[v] = Object.assign({}, S.tries[v], { pending: true }); render(); setTimeout(() => { S.tries[v] = Object.assign({}, S.tries[v], { pending: false, done: true }); render(); }, 900); },
  charge: () => { S.charge = !S.charge; render(); },
  buy: (v) => { S.points += +v; S.charge = false; toast(`${won(+v)} 포인트를 충전했습니다`); },
  gtoggle: (v) => { S.gopen[v] = S.gopen[v] === false; render(); },
  os: (v) => { S.os = v; render(); },
  copy: (v) => { if (navigator.clipboard) navigator.clipboard.writeText(v).catch(() => {}); toast('복사했습니다'); },
  pickProject: (v) => { S.cur = v; render(); },
  openProject: (v) => { const p = S.projects.find((x) => x.id === v); if (!p || !p.snap) return; Object.assign(S, JSON.parse(JSON.stringify(p.snap))); go('quote'); }
};
document.addEventListener('click', (e) => { const el = e.target.closest('[data-a]'); if (!el || el.disabled) return; e.preventDefault(); A[el.dataset.a] && A[el.dataset.a](el.dataset.v, el); });
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target.dataset.f;
  if (f === 'talk') { const inp = document.getElementById('talkIn'); const v = inp.value; inp.value = ''; talk(v); }
  if (f === 'save') {
    const cb = combo(S.sel), add = tierAdd(S.sel);
    const snapKeys = ['text', 'env', 'envGuess', 'steps', 'focus', 'preset', 'months', 'q', 'limit', 'sel', 'pick', 'pcOk', 'checks'];
    const snap = {}; snapKeys.forEach((k) => { snap[k] = JSON.parse(JSON.stringify(S[k] === undefined ? null : S[k])); });
    snap.envBudgetTotal = S.envBudgetTotal;
    const name = document.getElementById('pname').value.trim() || defaultName();
    S.projects.forEach((p) => { p.fresh = false; });
    const id = 'p' + Date.now();
    S.projects.unshift({ id, name, date: '방금', tier: TIERS[S.sel].name, tools: Object.values(cb).map((x) => T[x].name.split(' · ')[0]).concat(S.steps.code && codeCovered() ? [S.env.tool] : []).join(' · '), add, total: planPrice() + add, alerts: 0, fresh: true, snap });
    S.cur = id; go('track'); toast('저장했습니다');
  }
});
document.addEventListener('keydown', (e) => { if (e.target.id === 'task' && e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); A.submit(); } });
document.addEventListener('input', (e) => { const t = e.target; if (t.id === 'task') { S.text = t.value; const c = document.getElementById('chips'); if (c) c.innerHTML = chipsHtml(); } if (t.id === 'talkIn') previewTalk(t.value); if (t.id && t.id.startsWith('pr-')) { /* 프롬프트 수정은 화면에만 반영 */ } });
document.addEventListener('change', (e) => {
  const t = e.target, i = t.dataset.i, n = parseInt(String(t.value).replace(/[^0-9]/g, ''), 10) || 0;
  if (i === 'months') { S.months = Math.max(1, n); render(); }
  if (i === 'q') { S.q[t.dataset.k] = Math.min(n, 999); S.preset = 'custom'; render(); }
  if (t.dataset.c) { S.checks[t.dataset.c] = t.checked; render(); }
});
render();
</script>
<script src="/kiosk/touch-kb.js"></script>
<script src="/kiosk/idle-reset.js"></script>
</body>
</html>
